services:
  aidee-app: # PHP 8.5 FPM - reutiliza Dockerfile de arriendos
    build: ../arriendos/docker/php
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./templates:/var/www/html/templates
      - ./storage:/var/www/html/storage
    environment:
      DB_HOST: ${DB_HOST:-arriendos-db-1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-aidee_home2}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerida en .env}
    networks:
      arriendos:
        aliases: [aidee-app]
    restart: unless-stopped

  aidee-web: # CRM aidee_home2 + futuros webhooks
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8082}:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [arriendos]
    depends_on: [aidee-app]
    restart: unless-stopped

networks:
  arriendos:
    external: true
    name: arriendos_arriendos
